services:
  proxy:
    build: .
    ports:
      - "${PROXY_PORT:-3050}:3050"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "3050"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s