services:
  cc-proxy:
    image: ghcr.io/youyou-sudo/cc-p:${CC_IMAGE_TAG-latest}
    restart: unless-stopped
    expose:
      - 3050
    environment:
      PORT: "${PORT-3050}"
      HOST: "${HOST-0.0.0.0}"
      CC_API_BASE: "${CC_API_BASE-https://api.commandcode.ai}"
      CC_API_KEY: "${CC_API_KEY-}"
      CORS_ALLOW_ORIGIN: "${CORS_ALLOW_ORIGIN-}"
      LOG_LEVEL: "${LOG_LEVEL-info}"
      LOG_FILE: "${LOG_FILE-}"
      CC_USE_PROVIDER_MODELS: "${CC_USE_PROVIDER_MODELS-true}"
      CC_MODEL_REFRESH_INTERVAL_MS: "${CC_MODEL_REFRESH_INTERVAL_MS-300000}"
      CMD_ZDR: "${CMD_ZDR-false}"
      CC_STREAM_IDLE_MS: "${CC_STREAM_IDLE_MS-30000}"
      CC_NONSTREAM_IDLE_MS: "${CC_NONSTREAM_IDLE_MS-90000}"
      CC_THINKING_IDLE_MS: "${CC_THINKING_IDLE_MS-120000}"
      CC_MAX_BODY_MB: "${CC_MAX_BODY_MB-100}"
      CC_MAX_CONCURRENCY_PER_KEY: "${CC_MAX_CONCURRENCY_PER_KEY-16}"
      CC_MAX_QUEUE_PER_KEY: "${CC_MAX_QUEUE_PER_KEY-64}"
      CC_QUEUE_TIMEOUT_MS: "${CC_QUEUE_TIMEOUT_MS-60000}"
      CC_RETRY_MAX: "${CC_RETRY_MAX-3}"
      CC_RETRY_BASE_MS: "${CC_RETRY_BASE_MS-1000}"
      CC_RETRY_CAP_MS: "${CC_RETRY_CAP_MS-30000}"
      CC_EMPTY_SYSTEM_PLACEHOLDER: "${CC_EMPTY_SYSTEM_PLACEHOLDER-true}"
      TZ: "${TZ-Asia/Shanghai}"

networks:
  default:
    driver: bridge
